name: Bug report
description: Something isn't working (audio, devices, effects, driver, crashes)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Audio bugs are very environment-specific, so please fill in the hardware/version details — it saves a lot of back-and-forth.
        For **security** issues, do not file here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open EchoDeck
        2. Enable AEC + Noise removal
        3. ...
    validations:
      required: true
  - type: input
    id: echodeck-version
    attributes:
      label: EchoDeck version
      placeholder: "v0.1.0 or commit hash"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version/build
      placeholder: "Windows 11 23H2 (22631.xxxx)"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: NVIDIA GPU model + driver
      placeholder: "RTX 3080, driver 5xx.xx"
    validations:
      required: true
  - type: input
    id: afx-sdk
    attributes:
      label: NVIDIA Audio Effects SDK version
      placeholder: "1.6.1.2"
    validations:
      required: false
  - type: textarea
    id: devices
    attributes:
      label: Audio devices involved
      description: Mic, speaker/reference, and the output (virtual mic / VB-Cable) you're using.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
    validations:
      required: false
