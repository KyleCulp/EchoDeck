name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # NVIDIA Audio Effects SDK is resolved at runtime (P/Invoke), so it is not
      # needed to compile. Enable tests once a test project exists (roadmap Phase 1):
      # - name: Test
      #   run: dotnet test --configuration Release --no-build
